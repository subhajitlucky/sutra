name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile check
        run: python -m compileall -q sutra

      - name: Parse the examples
        run: |
          for f in examples/*.sutra; do
            python -m sutra parse "$f" > /dev/null
          done

      - name: Compact deal demo
        run: python examples/compact_deal.py > /dev/null

      - name: Runtime compact demo
        run: python examples/runtime_compact_demo.py > /dev/null

      - name: Network compact demo (HTTP, C1)
        run: python examples/network_compact_demo.py > /dev/null

      - name: Network meter demo (HTTP, template mode)
        run: python examples/network_meter_demo.py > /dev/null
